      - name: Test with OLLAMA_HOST environment variable
        run: |
          curl -fsSL https://raw.githubusercontent.com/dorcha-inc/orla/${{ github.ref }}/scripts/test-remote-ollama.sh | sh -s -- env

      - name: Test with llm_backend configuration
        run: |
          curl -fsSL https://raw.githubusercontent.com/dorcha-inc/orla/${{ github.ref }}/scripts/test-remote-ollama.sh | sh -s -- config